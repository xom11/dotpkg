name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # The docs/ half of the citation gate. The src/ and tests/ half is a test
      # in the suite above, because those two directories are what the Windows
      # shipping tarball carries; docs/ is only ever present in a full checkout,
      # which is what CI has. Neither half claims the other's scope.
      - run: python3 scripts/check-citations.py
