[package]
name = "dotpkg"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Declarative package management for Windows: winget and scoop from one dotfile, with a real lock file and prune"
repository = "https://github.com/xom11/dotpkg"
license = "MIT"

[lib]
name = "dotpkg"
path = "src/lib.rs"

[[bin]]
name = "dotpkg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
