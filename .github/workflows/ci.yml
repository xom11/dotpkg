name: CI
on:
  push:
    branches: [main]
  pull_request:
  # So the scoop job below can be exercised without opening a pull request.
  # It installs scoop from the network and is the one job here that can fail
  # for a reason that is nobody's fault, so being able to re-run it alone
  # matters more than it does for the suite.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # The docs/ half of the citation gate. The src/ and tests/ half is a test
      # in the suite above, because those two directories are what the Windows
      # shipping tarball carries; docs/ is only ever present in a full checkout,
      # which is what CI has. Neither half claims the other's scope.
      - run: python3 scripts/check-citations.py
      # The backtick half. Three of the PowerShell scripts open by stating that
      # no backtick appears in them "including in comments", and that "both
      # gates exist and both must run" -- and only the parse-check existed, so
      # one of those files carried a backtick in a comment for two phases. Not
      # a test in the suite for the same reason as the line above: the Windows
      # shipping tarball does not carry scripts/, and a suite gate that
      # tolerates its directory being absent is a gate that scans nothing.
      - run: python3 scripts/check-ps1-style.py

  # The design of 2026-08-08 named three test layers. Layers 1 and 2 are the
  # job above and run everywhere. Layer 3 -- "real scoop in a throwaway
  # $env:SCOOP on a Windows runner, gated" -- was specified and then never
  # built, and `tests/cli.rs` is not it: that suite is hermetic by design, with
  # SCOOP and LOCALAPPDATA pointed at temporary directories and winget removed
  # from PATH, so nothing in it has ever run the scoop binary. Every piece of
  # evidence that dotpkg drives real scoop correctly came from a human running
  # a dogfood round by hand.
  #
  # This is that layer. It installs scoop into a throwaway root, builds a
  # bucket that is a real git repository, serves a real archive over real HTTP
  # so scoop does its own hash verification, and then makes dotpkg install and
  # prune through it -- checking the disk each time rather than an exit code.
  #
  # Hermetic despite being real: the only network call is scoop's own
  # installer. The package comes from 127.0.0.1.
  scoop-integration:
    name: scoop, for real, in a throwaway root
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release

      - name: Install scoop into a throwaway root
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ci-scoop'
          "SCOOP=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:SCOOP = $root
          # The runner's user is an administrator, which scoop's installer
          # refuses by default. -RunAsAdmin is the sanctioned way in, and
          # allow_admin_install is what lets `scoop install` proceed later.
          Invoke-WebRequest -UseBasicParsing get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin -ScoopDir $root
          "$root\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$root\shims;$env:PATH"
          scoop config allow_admin_install true
          # Verified by output, never by exit code -- the rule this whole
          # project runs on. A scoop that failed to install still leaves a
          # zero somewhere.
          $v = scoop --version 2>&1 | Out-String
          Write-Host "scoop_version_output: $v"
          if (-not (Test-Path -LiteralPath "$root\shims\scoop.ps1")) { throw 'scoop did not install' }

      - name: Build a bucket that is a real git repository, and serve a real archive
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'payload'
          $serve   = Join-Path $env:RUNNER_TEMP 'serve'
          New-Item -ItemType Directory -Force -Path $payload, $serve | Out-Null
          # A .cmd so scoop has something to shim, which is what makes the
          # install observable as more than a directory appearing.
          Set-Content -LiteralPath "$payload\ci-payload.cmd" -Value '@echo ci-payload 1.0.0'
          Compress-Archive -Path "$payload\ci-payload.cmd" -DestinationPath "$serve\payload.zip" -Force
          $hash = (Get-FileHash -LiteralPath "$serve\payload.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "payload_sha256: $hash"

          # Real HTTP from localhost: scoop performs its own download and its
          # own hash check, which is the part that must not be faked. dotpkg
          # never verifies a hash itself and must never pass --skip-hash-check.
          $py = Start-Process -PassThru -FilePath 'python' -ArgumentList '-m','http.server','8765' -WorkingDirectory $serve
          "HTTPD_PID=$($py.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Milliseconds 300
            try { Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/payload.zip' -OutFile "$env:RUNNER_TEMP\probe.zip"; $ok = $true; break } catch { }
          }
          if (-not $ok) { throw 'the local http server never served the payload' }

          $bucket = Join-Path $env:SCOOP 'buckets\ci'
          New-Item -ItemType Directory -Force -Path "$bucket\bucket" | Out-Null
          $manifest = @{
            version = '1.0.0'
            url     = 'http://127.0.0.1:8765/payload.zip'
            hash    = $hash
            bin     = 'ci-payload.cmd'
          } | ConvertTo-Json
          Set-Content -LiteralPath "$bucket\bucket\ci-payload.json" -Value $manifest
          git -C $bucket init -q
          git -C $bucket config user.email ci@example.invalid
          git -C $bucket config user.name ci
          git -C $bucket add -A
          git -C $bucket commit -q -m 'ci-payload 1.0.0'
          Write-Host ("bucket_head: " + (git -C $bucket rev-parse HEAD))

      - name: Resolve a lock against that bucket, and plan
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'work'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          "WORK=$work" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -LiteralPath "$work\pkg.toml" -Value "[scoop]`nbuckets  = [`"ci`"]`npackages = [`"ci-payload`"]`n"
          $exe = "$env:GITHUB_WORKSPACE\target\release\dotpkg.exe"
          & $exe update --config "$work\pkg.toml" --lock "$work\pkg.lock" --offline
          Get-Content -LiteralPath "$work\pkg.lock" -Raw
          if (-not (Select-String -LiteralPath "$work\pkg.lock" -Pattern 'ci-payload' -Quiet)) {
            throw 'update resolved nothing: the lock does not name the package'
          }
          & $exe status --config "$work\pkg.toml" --lock "$work\pkg.lock"

      - name: apply --prepare must change nothing
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\target\release\dotpkg.exe"
          & $exe apply --config "$env:WORK\pkg.toml" --lock "$env:WORK\pkg.lock" --state "$env:WORK\state.json" --prepare
          if (Test-Path -LiteralPath "$env:SCOOP\apps\ci-payload") { throw '--prepare installed something' }
          if (Test-Path -LiteralPath "$env:WORK\state.json") { throw '--prepare claimed ownership' }

      - name: apply installs for real, and the disk is the verdict
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\target\release\dotpkg.exe"
          if (Test-Path -LiteralPath "$env:SCOOP\apps\ci-payload") { throw 'the subject was already installed; the test would prove nothing' }
          & $exe apply --config "$env:WORK\pkg.toml" --lock "$env:WORK\pkg.lock" --state "$env:WORK\state.json" --yes
          if (-not (Test-Path -LiteralPath "$env:SCOOP\apps\ci-payload\current\manifest.json")) { throw 'no installed manifest on disk' }
          $m = Get-Content -LiteralPath "$env:SCOOP\apps\ci-payload\current\manifest.json" -Raw | ConvertFrom-Json
          if ($m.version -ne '1.0.0') { throw "installed version is $($m.version), not the pinned 1.0.0" }
          $state = Get-Content -LiteralPath "$env:WORK\state.json" -Raw
          Write-Host "state: $state"
          if (-not ($state -match 'ci-payload')) { throw 'dotpkg installed it without recording ownership' }

      - name: the prune guard must be in the way before the prune is believed
        shell: pwsh
        run: |
          # The counterweight. Without it, the removal below proves only that
          # apply removes things, not that anything ever stood between a user
          # and an empty pkg.toml.
          #
          # This step is the one place in the job where a NON-ZERO exit is the
          # pass condition, so the usual plumbing has to be turned off in two
          # places: PowerShell 7.3+ turns a failing native command into a
          # terminating error under `ErrorActionPreference = 'stop'` (which is
          # what Actions sets), and the pwsh wrapper carries `$LASTEXITCODE`
          # out as the step's own exit code. The first run of this job passed
          # every assertion here -- `refusal_exit: 2`, package still installed
          # -- and failed anyway on that second mechanism.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = "$env:GITHUB_WORKSPACE\target\release\dotpkg.exe"
          Set-Content -LiteralPath "$env:WORK\pkg.toml" -Value "[scoop]`nbuckets  = [`"ci`"]`npackages = []`n"
          & $exe apply --config "$env:WORK\pkg.toml" --lock "$env:WORK\pkg.lock" --state "$env:WORK\state.json" --yes
          $code = $LASTEXITCODE
          Write-Host "refusal_exit: $code"
          if ($code -ne 2) { throw "an empty pkg.toml with an owned package must refuse at exit 2, got $code" }
          if (-not (Test-Path -LiteralPath "$env:SCOOP\apps\ci-payload")) { throw 'the refusal removed the package anyway' }
          # Explicit, so the refusal this step exists to observe cannot be
          # mistaken for the step failing.
          exit 0

      - name: prune for real, and confirm ownership is released
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\target\release\dotpkg.exe"
          & $exe update --config "$env:WORK\pkg.toml" --lock "$env:WORK\pkg.lock" --offline
          & $exe apply --config "$env:WORK\pkg.toml" --lock "$env:WORK\pkg.lock" --state "$env:WORK\state.json" --yes --allow-prune --allow-empty-config
          if (Test-Path -LiteralPath "$env:SCOOP\apps\ci-payload") { throw 'the package is still installed after a prune that reported success' }
          $state = Get-Content -LiteralPath "$env:WORK\state.json" -Raw
          Write-Host "state after prune: $state"
          if ($state -match 'ci-payload') { throw 'ownership was not released' }

      - name: stop the local server
        if: always()
        shell: pwsh
        run: |
          if ($env:HTTPD_PID) { Stop-Process -Id $env:HTTPD_PID -Force -ErrorAction SilentlyContinue }
